<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#111827"/>

  <!-- AWP silhouette (centered, horizontal) -->
  <!-- Stock -->
  <path d="M6 27 L6 38 Q8 40 11 38 L14 35 L14 30 L11 27 Z" fill="#e2a84b"/>
  <!-- Lower receiver -->
  <rect x="14" y="29" width="18" height="9" rx="1.5" fill="#c8922a"/>
  <!-- Upper receiver -->
  <rect x="14" y="24" width="22" height="7" rx="1.5" fill="#d49830"/>
  <!-- Scope body -->
  <rect x="20" y="17" width="14" height="8" rx="2" fill="#3b3b3b"/>
  <!-- Scope lenses -->
  <circle cx="22" cy="21" r="2.8" fill="#0f172a" stroke="#6b7280" stroke-width="0.8"/>
  <circle cx="32" cy="21" r="2.8" fill="#0f172a" stroke="#6b7280" stroke-width="0.8"/>
  <!-- Scope highlight -->
  <circle cx="21" cy="20" r="0.9" fill="#60a5fa" opacity="0.7"/>
  <circle cx="31" cy="20" r="0.9" fill="#60a5fa" opacity="0.7"/>
  <!-- Barrel -->
  <rect x="36" y="30" width="22" height="4" rx="1" fill="#4b5563"/>
  <!-- Muzzle brake detail -->
  <rect x="55" y="29" width="3" height="6" rx="0.8" fill="#374151"/>
  <!-- Bolt handle -->
  <rect x="34" y="24" width="5" height="2" rx="1" fill="#6b7280"/>
  <circle cx="39" cy="25" r="1.8" fill="#9ca3af"/>
  <!-- Grip -->
  <path d="M25 38 Q24 46 27 47 L31 47 Q33 46 32 38 Z" fill="#92400e"/>
  <!-- Trigger -->
  <path d="M27 36 Q28 41 31 38" fill="none" stroke="#78350f" stroke-width="1.2"/>
