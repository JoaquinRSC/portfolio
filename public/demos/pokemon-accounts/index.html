<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>PokéAccounts — Demo</title>
    <link rel="icon" href="/demos/pokemon-accounts/icon.svg">
    <meta name="theme-color" content="#ffd000">
    <script type="module" crossorigin src="/demos/pokemon-accounts/assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="/demos/pokemon-accounts/assets/index.css">
    <!-- Portfolio demo chrome (injected manually; re-apply if this build is regenerated) -->
    <style>
      /* Hide scrollbars for a cleaner demo look (scroll still works). */
      html { scrollbar-width: none; -ms-overflow-style: none; }
      *::-webkit-scrollbar { width: 0; height: 0; display: none; }

      /* Floating "back to portfolio" link, shown only when this demo is the
         top-level page (opened in a new tab), not inside the portfolio iframe. */
      .demo-back {
        position: fixed; left: 12px; bottom: 12px; z-index: 99999;
        display: none; align-items: center; gap: 6px;
        padding: 9px 14px; border-radius: 999px;
        font: 600 13px/1 'Inter', system-ui, sans-serif;
        color: #fff7d6; background: rgba(20,16,2,.85);
        border: 1px solid rgba(245,204,21,.4);
        box-shadow: 0 6px 24px rgba(0,0,0,.5); backdrop-filter: blur(6px);
        text-decoration: none;
      }
      .demo-back:hover { border-color: #facc15; color: #facc15; }
    </style>
  </head>
  <body>
    <div id="q-app"></div>
    <a href="/#projects" class="demo-back" id="demo-back">&larr; Portfolio</a>
    <script>if (window.self === window.top) { var b = document.getElementById('demo-back'); if (b) b.style.display = 'inline-flex'; }</script>
  </body>
</html>
